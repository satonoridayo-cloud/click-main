<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ズーム対策: ダブルタップ/ピンチでの拡大を無効化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オンラインクリックゲーム</title>
    <style>
        html, body {
            touch-action: manipulation; /* ダブルタップズームを抑止 */
            -webkit-tap-highlight-color: transparent;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 10px; }

        .points-display { background: #fff8e1; color: #f39c12; font-size: 20px; font-weight: bold; padding: 10px 16px; border-radius: 10px; display: inline-block; margin-bottom: 14px; }
        .points-display .label { font-size: 13px; color: #b9770e; font-weight: normal; display: block; }

        .name-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .user-tag { background: #e1f5fe; color: #0288d1; padding: 6px 12px; border-radius: 20px; font-weight: bold; display: inline-block; }
        .name-input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 140px; }
        .btn-small { background: #3498db; color: white; border: none; padding: 7px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; }
        .btn-small:hover { background: #2980b9; }

        .btn { background: #3498db; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 10px; transition: 0.2s; touch-action: manipulation; }
        .btn:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .screen { display: none; }
        .active { display: block; }
        #click-target {
            width: 150px; height: 150px; background: #e74c3c; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;
            margin: 30px auto; cursor: pointer; user-select: none;
            box-shadow: 0 6px 0 #c0392b; transition: 0.05s;
            touch-action: manipulation; /* ズーム対策 */
            -webkit-user-select: none;
        }
        #click-target:active { transform: translateY(4px); box-shadow: 0 2px 0 #c0392b; }
        #click-target.disabled { background: #bdc3c7 !important; box-shadow: 0 6px 0 #95a5a6 !important; cursor: not-allowed; }
        .game-actions-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
        .game-actions-row .btn { margin: 0; flex: 1; max-width: 160px; }
        .result-text-area { font-size: 16px; font-weight: bold; min-height: 20px; margin: 8px 0; }
        .timer, .score { font-size: 22px; font-weight: bold; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 13px; }
        th { background: #f8f9fa; }
        .waiting-note { color: #888; font-size: 14px; margin-top: 10px; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #3498db; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint { font-size: 12px; color: #999; margin-top: 6px; }
        .vs-text { font-size: 26px; font-weight: bold; margin: 20px 0; color: #2c3e50; }
        #online-users-list li { padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        #online-users-list li:last-child { border-bottom: none; }
        .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; margin-right: 6px; }
    </style>
</head>
<body>

<div class="container">
    <!-- ホーム画面 -->
    <div id="home-screen" class="screen active">
        <h1>🔥 オンラインクリックゲーム 🔥</h1>

        <div class="points-display">
            <span class="label">累計ポイント</span>
            <span id="total-points">0</span> pt
        </div>
        <br>

        <div class="name-row">
            <div class="user-tag" id="display-username">名前: 読み込み中...</div>
            <input type="text" id="name-input" class="name-input" placeholder="新しい名前" maxlength="20">
            <button class="btn-small" onclick="changeName()">名前を変更</button>
        </div>

        <button class="btn" onclick="showScreen('single-menu-screen')">一人でプレイ (VS CPU)</button>
        <button class="btn" onclick="startMultiMatch()">二人でプレイ (オンライン)</button>

        <h3>🟢 オンラインのプレイヤー</h3>
        <ul id="online-users-list" style="list-style:none; padding:0; text-align:left; max-width:300px; margin:0 auto;">
            <li style="color:#888;">読み込み中...</li>
        </ul>

        <h3>💎 ポイントランキング</h3>
        <table id="points-ranking-table">
            <tr><th>順位</th><th>名前</th><th>累計ポイント</th></tr>
        </table>

        <h3>🏆 ホームランキング</h3>
        <table id="ranking-table">
            <tr><th>日時</th><th>P1 (Pt)</th><th>P2 (Pt)</th><th>勝者</th></tr>
        </table>
    </div>

    <!-- 一人プレイ難易度選択画面 -->
    <div id="single-menu-screen" class="screen">
        <h2>一人プレイ：難易度選択 (VS CPU)</h2>
        <button class="btn" onclick="startSingleGame('easy')">簡単 (CPU: 秒間5回)</button>
        <button class="btn" onclick="startSingleGame('normal')">ちょい難 (CPU: 秒間7回)</button>
        <button class="btn" onclick="startSingleGame('hard')">難しい (CPU: 秒間14回)</button>
        <button class="btn btn-danger" onclick="startSingleGame('death')">死 (CPU: 秒間20回)</button>
        <br><br>
        <button class="btn" style="background:#95a5a6;" onclick="showScreen('home-screen')">戻る</button>
    </div>

    <!-- マッチング待機画面 -->
    <div id="matching-screen" class="screen">
        <h2>オンラインマッチング中...</h2>
        <div class="timer" id="matching-status"><span class="spinner"></span>ランダムなプレイヤーを探しています...</div>
        <br>
        <button class="btn btn-danger" onclick="cancelMatch()">キャンセル</button>
    </div>

    <!-- 対戦確認画面 -->
    <div id="confirm-screen" class="screen">
        <h2>相手が見つかりました！</h2>
        <div class="vs-text">VS <span id="confirm-opponent-name"></span></div>
        <p>戦いますか？</p>
        <button class="btn btn-success" onclick="acceptMatch()">戦う！</button>
        <button class="btn btn-danger" onclick="declineMatch()">やめる</button>
    </div>

    <!-- ゲームプレイ画面(結果表示・ボタンも同じ画面内に統合。
         連打の勢いで画面が切り替わった瞬間に別のボタンを
         誤タップしてしまうのを防ぐため、画面遷移せず
         同じ場所でボタンの有効/無効だけ切り替える) -->
    <div id="game-screen" class="screen">
        <h2 id="game-title">ゲーム中</h2>

        <div class="game-actions-row">
            <button class="btn btn-success" id="retry-btn" onclick="retryGame()" disabled>もう一度やる</button>
            <button class="btn" style="background:#95a5a6;" id="home-btn" onclick="goHomeFromResult()" disabled>ホームに戻る</button>
        </div>

        <p id="result-text" class="result-text-area"></p>
        <p id="result-waiting-note" class="waiting-note" style="display:none;">
            <span class="spinner"></span>相手の結果を待っています...
        </p>

        <div class="timer">残り時間: <span id="time-left">10.0</span> 秒</div>
        <div class="score">あなた: <span id="current-score">0</span> pt</div>
        <div id="cpu-score-area" style="display:none;" class="score">CPU: <span id="current-cpu-score">0</span> pt</div>
        <div id="click-target" onclick="handleClick()">CLICK!</div>
        <div class="hint">スペースキーでもクリックできます</div>
    </div>
</div>

<script>
    // ★ バックエンド(Flask)のURLを指定
    const API_BASE = "https://click-server-xnnb.onrender.com";

    const NAME_STORAGE_KEY = 'clickgame_playerName';
    const POINTS_STORAGE_KEY = 'clickgame_totalPoints';

    function generateRandomName() {
        return "Player_" + Math.floor(Math.random() * 9000 + 1000);
    }

    function loadStoredName() {
        try {
            const stored = localStorage.getItem(NAME_STORAGE_KEY);
            if (stored && stored.trim()) return stored;
        } catch (e) {
            console.warn("localStorageが利用できません:", e);
        }
        return generateRandomName();
    }

    function saveNameToStorage(name) {
        try {
            localStorage.setItem(NAME_STORAGE_KEY, name);
        } catch (e) {
            console.warn("localStorageへの保存に失敗しました:", e);
        }
    }

    function loadStoredPoints() {
        try {
            const stored = localStorage.getItem(POINTS_STORAGE_KEY);
            const parsed = parseInt(stored, 10);
            if (!isNaN(parsed)) return parsed;
        } catch (e) {
            console.warn("localStorageが利用できません:", e);
        }
        return 0;
    }

    function savePointsToStorage(points) {
        try {
            localStorage.setItem(POINTS_STORAGE_KEY, String(points));
        } catch (e) {
            console.warn("localStorageへの保存に失敗しました:", e);
        }
    }

    let playerName = loadStoredName();
    saveNameToStorage(playerName); // 初回生成した名前も次回のために保存しておく
    let totalPoints = loadStoredPoints();

    document.getElementById('display-username').textContent = `名前: ${playerName}`;
    document.getElementById('total-points').textContent = totalPoints;

    let gameMode = "";
    let difficulty = "";
    let score = 0;
    let cpuScore = 0;
    let timeLeft = 10.0;
    let timerInterval = null;
    let cpuInterval = null;
    let matchingInterval = null;
    let resultPollInterval = null;
    let opponentName = "";
    let currentSessionId = null;    // ============================================================
    // 名前変更
    // ============================================================
    function changeName() {
        const input = document.getElementById('name-input');
        const newName = input.value.trim();
        if (!newName) return;
        const oldName = playerName;
        playerName = newName;
        saveNameToStorage(playerName);
        document.getElementById('display-username').textContent = `名前: ${playerName}`;
        input.value = '';

        // 古い名前のオンライン表示をすぐ消し、新しい名前で登録し直す
        fetch(`${API_BASE}/api/presence/leave`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: oldName})
        }).catch(() => {});
        sendPresenceHeartbeat();
        loadOnlineUsers();
    }

    // ============================================================
    // 累計ポイント
    // ============================================================
    function addPoints(amount) {
        totalPoints += amount;
        document.getElementById('total-points').textContent = totalPoints;
        savePointsToStorage(totalPoints);
    }

    // ============================================================
    // 画面切り替え
    // ============================================================
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function loadRanking() {
        fetch(`${API_BASE}/api/ranking`)
        .then(res => res.json())
        .then(data => {
            let table = document.getElementById('ranking-table');
            table.innerHTML = `<tr><th>日時</th><th>P1 (Pt)</th><th>P2 (Pt)</th><th>勝者</th></tr>`;
            data.forEach(row => {
                let dateStr = new Date(row.created_at).toLocaleTimeString();
                table.innerHTML += `<tr>
                    <td>${dateStr}</td>
                    <td>${row.player1_name} (${row.player1_points})</td>
                    <td>${row.player2_name} (${row.player2_points})</td>
                    <td><b>${row.winner}</b></td>
                </tr>`;
            });
        }).catch(err => console.error("ランキング取得エラー:", err));
    }

    // ============================================================
    // ポイントランキング
    // ============================================================
    function loadPointsRanking() {
        fetch(`${API_BASE}/api/points_ranking`)
        .then(res => res.json())
        .then(data => {
            let table = document.getElementById('points-ranking-table');
            table.innerHTML = `<tr><th>順位</th><th>名前</th><th>累計ポイント</th></tr>`;
            if (!Array.isArray(data) || data.length === 0) {
                table.innerHTML += `<tr><td colspan="3" style="color:#999;">まだ記録がありません</td></tr>`;
                return;
            }
            data.forEach((row, i) => {
                table.innerHTML += `<tr>
                    <td>${i + 1}</td>
                    <td>${row.username}${row.username === playerName ? '（あなた）' : ''}</td>
                    <td>${row.total_points}</td>
                </tr>`;
            });
        }).catch(err => console.error("ポイントランキング取得エラー:", err));
    }

    // ============================================================
    // オンラインプレゼンス(今サイトにいる人)
    // ============================================================
    const PRESENCE_HEARTBEAT_MS = 10000;
    let presenceInterval = null;

    function sendPresenceHeartbeat() {
        fetch(`${API_BASE}/api/presence/heartbeat`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: playerName})
        }).catch(err => console.error("プレゼンス送信エラー:", err));
    }

    function loadOnlineUsers() {
        fetch(`${API_BASE}/api/presence/online`)
        .then(res => res.json())
        .then(data => {
            let list = document.getElementById('online-users-list');
            if (!Array.isArray(data) || data.length === 0) {
                list.innerHTML = `<li style="color:#888;">誰もいません</li>`;
                return;
            }
            list.innerHTML = data.map(name =>
                `<li><span class="online-dot"></span>${name}${name === playerName ? '（あなた）' : ''}</li>`
            ).join('');
        }).catch(err => console.error("オンライン一覧取得エラー:", err));
    }

    // ページを開いた時点でハートビート開始 + 定期送信
    sendPresenceHeartbeat();
    presenceInterval = setInterval(sendPresenceHeartbeat, PRESENCE_HEARTBEAT_MS);

    loadRanking();
    loadPointsRanking();
    loadOnlineUsers();
    setInterval(loadOnlineUsers, 8000);
    setInterval(loadPointsRanking, 15000);

    window.addEventListener('beforeunload', () => {
        navigator.sendBeacon(`${API_BASE}/api/match/cancel`, JSON.stringify({username: playerName}));
        navigator.sendBeacon(`${API_BASE}/api/presence/leave`, JSON.stringify({username: playerName}));
    });

    // ============================================================
    // スペースキー対応
    // ============================================================
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
            const gameScreen = document.getElementById('game-screen');
            if (gameScreen.classList.contains('active')) {
                e.preventDefault(); // ページスクロール防止
                handleClick();
            }
        }
    });

    function stopAllIntervals() {
        clearInterval(timerInterval);
        clearInterval(cpuInterval);
        clearInterval(matchingInterval);
        clearInterval(resultPollInterval);
        timerInterval = null;
        cpuInterval = null;
        matchingInterval = null;
        resultPollInterval = null;
    }

    function startSingleGame(diff) {
        difficulty = diff;
        gameMode = 'single';
        score = 0;
        cpuScore = 0;
        timeLeft = 10.0;
        document.getElementById('current-score').textContent = score;
        document.getElementById('current-cpu-score').textContent = cpuScore;
        document.getElementById('cpu-score-area').style.display = 'block';
        document.getElementById('game-title').textContent = `一人プレイ (VS CPU: ${diff.toUpperCase()})`;
        document.getElementById('result-text').textContent = '';
        document.getElementById('result-waiting-note').style.display = 'none';
        setClickTargetEnabled(true);
        setGameActionButtonsEnabled(false, false);
        showScreen('game-screen');

        let cpuSpeedMap = { 'easy': 200, 'normal': 143, 'hard': 71, 'death': 50 };
        let cpuIntervalTime = cpuSpeedMap[diff] || 200;

        cpuInterval = setInterval(() => {
            cpuScore += 1;
            document.getElementById('current-cpu-score').textContent = cpuScore;
        }, cpuIntervalTime);

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            let displayTime = Math.max(0, timeLeft);
            document.getElementById('time-left').textContent = displayTime.toFixed(1);

            if (displayTime <= 0) {
                endGame();
            }
        }, 100);
    }

    // ============================================================
    // マッチング
    // ============================================================
    function startMultiMatch() {
        currentSessionId = null;
        opponentName = "";
        showScreen('matching-screen');
        document.getElementById('matching-status').innerHTML =
            `<span class="spinner"></span>${playerName} でオンライン行に登録中...`;

        matchingInterval = setInterval(() => {
            fetch(`${API_BASE}/api/match/join`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: playerName})
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'matched') {
                    clearInterval(matchingInterval);
                    matchingInterval = null;
                    opponentName = data.opponent;
                    currentSessionId = data.session_id;
                    // ★いきなり開始せず「戦いますか？」確認画面を挟む
                    document.getElementById('confirm-opponent-name').textContent = opponentName;
                    showScreen('confirm-screen');
                } else if (data.status === 'waiting') {
                    document.getElementById('matching-status').innerHTML =
                        `<span class="spinner"></span>${playerName} でオンライン行に登録中...`;
                } else if (data.error) {
                    // サーバー側のエラーを画面に出す(以前は無視されて
                    // 無限にポーリングし続け「マッチングしない」ように
                    // 見えるだけだったため)
                    clearInterval(matchingInterval);
                    matchingInterval = null;
                    document.getElementById('matching-status').textContent =
                        `マッチングでエラーが発生しました: ${data.error}`;
                }
            })
            .catch(err => {
                console.error("マッチング取得エラー:", err);
                document.getElementById('matching-status').textContent =
                    `通信エラーが発生しました。ネットワーク状況を確認してください。`;
            });
        }, 2000);
    }

    function cancelMatch() {
        clearInterval(matchingInterval);
        matchingInterval = null;
        fetch(`${API_BASE}/api/match/cancel`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: playerName})
        }).then(() => {
            showScreen('home-screen');
        }).catch(err => {
            console.error("キャンセルエラー:", err);
            showScreen('home-screen');
        });
    }

    // 確認画面: 「戦う」を選んだ場合
    function acceptMatch() {
        startMultiGame();
    }

    // 確認画面: 「やめる」を選んだ場合
    function declineMatch() {
        // session_id はリクエスト送信後にクリアする(先にnullにすると
        // サーバー側にセッションを伝えられず、相手が待ち続けてしまう)
        const sessionIdToCancel = currentSessionId;
        currentSessionId = null;
        opponentName = "";
        // session_idを渡すことで、サーバー側がそのセッションに
        // cancelledフラグを立て、相手が結果送信時にすぐ
        // 「相手が辞退しました」と分かるようにする
        fetch(`${API_BASE}/api/match/cancel`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: playerName, session_id: sessionIdToCancel})
        }).catch(() => {});
        showScreen('home-screen');
    }
 
    function startMultiGame() {
        gameMode = 'multi';
        score = 0;
        timeLeft = 10.0;
        document.getElementById('current-score').textContent = score;
        document.getElementById('cpu-score-area').style.display = 'none';
        document.getElementById('game-title').textContent = `対戦: VS ${opponentName}`;
        document.getElementById('result-text').textContent = '';
        document.getElementById('result-waiting-note').style.display = 'none';
        setClickTargetEnabled(true);
        setGameActionButtonsEnabled(false, false);
        showScreen('game-screen');
 
        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            let displayTime = Math.max(0, timeLeft);
            document.getElementById('time-left').textContent = displayTime.toFixed(1);
 
            if (displayTime <= 0) {
                endGame();
            }
        }, 100);
    }
 
    // ============================================================
    // CLICKボタン / もう一度やる・ホームに戻るボタンの有効/無効切り替え
    //
    // プレイ中は上のボタンをグレーで押せなくし、下のCLICKだけ押せる
    // ようにする。時間切れになったら逆にCLICKを押せなくして、
    // 上のボタンを押せるようにする。画面遷移せず同じ場所で
    // 切り替えるので、連打の勢いでボタンを誤タップすることがない。
    // ============================================================
    let clickEnabled = true;
 
    function setClickTargetEnabled(enabled) {
        clickEnabled = enabled;
        const target = document.getElementById('click-target');
        if (enabled) {
            target.classList.remove('disabled');
        } else {
            target.classList.add('disabled');
        }
    }
 
    function setGameActionButtonsEnabled(retryEnabled, homeEnabled) {
        if (homeEnabled === undefined) homeEnabled = retryEnabled;
        document.getElementById('retry-btn').disabled = !retryEnabled;
        document.getElementById('home-btn').disabled = !homeEnabled;
    }
 
    function handleClick() {
        if (!clickEnabled) return;
        score += 1;
        document.getElementById('current-score').textContent = score;
    }
 
    function endGame() {
        clearInterval(timerInterval);
        if (cpuInterval) clearInterval(cpuInterval);
        timerInterval = null;
        cpuInterval = null;
 
        // 時間切れ: CLICKを押せなくする(上のボタンの有効化は
        // 各分岐の中で、結果が確定したタイミングで行う)
        setClickTargetEnabled(false);
 
        document.getElementById('result-waiting-note').style.display = 'none';
 
        if (gameMode === 'single') {
            let isWin = score > cpuScore;
            let isDraw = score === cpuScore;
            let winLoseText = isWin ? "あなたの勝利！" : (isDraw ? "引き分け！" : "CPUの勝利...");
            document.getElementById('result-text').textContent = `${winLoseText} (あなた: ${score}pt vs CPU: ${cpuScore}pt)`;
            // 一人プレイは結果がその場で確定するので、すぐ両ボタンを有効化
            setGameActionButtonsEnabled(true, true);
 
            if (isWin) {
                addPoints(score); // 勝った時だけ累計ポイントに加算
            }
 
            fetch(`${API_BASE}/api/single_result`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: playerName, points: score, difficulty: difficulty, won: isWin})
            })
            .then(res => res.json())
            .then(() => loadPointsRanking())  // 勝った場合はランキングに反映されるので更新
            .catch(err => console.error("結果保存エラー:", err));
 
        } else if (gameMode === 'multi') {
            document.getElementById('result-text').textContent = `あなたのスコア: ${score}pt。結果を送信中...`;
            // 対戦相手の結果がまだ来ていないので、ホームには戻れるが
            // もう一度は結果確定までは押せないようにしておく
            setGameActionButtonsEnabled(false, true);
            submitMultiResult();
        }
    }
 
    function submitMultiResult() {
        if (!currentSessionId) {
            document.getElementById('result-text').textContent =
                `セッション情報が見つかりませんでした。ホームに戻ってやり直してください。`;
            setGameActionButtonsEnabled(true, true);
            return;
        }
 
        // 前回のfetchがまだ終わっていない場合は多重送信しない
        // (通信が遅い時に複数のリクエストが同時に飛んで、
        //  順序が入れ替わって届くのを防ぐ)
        if (resultRequestInFlight) return;
        resultRequestInFlight = true;
 
        fetch(`${API_BASE}/api/match/result`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                session_id: currentSessionId,
                username: playerName,
                points: score
            })
        })
        .then(res => res.json())
        .then(data => {
            resultRequestInFlight = false;
            handleMultiResultResponse(data);
        })
        .catch(err => {
            resultRequestInFlight = false;
            console.error("対戦結果送信エラー:", err);
            if (!multiResultFinalized) {
                document.getElementById('result-text').textContent = `結果送信に失敗しました。`;
                setGameActionButtonsEnabled(true, true);
            }
        });
    }
 
    let multiPointsAdded = false;
    // 通信の時間差(遅延・順序逆転)で古いレスポンスが後から届いても
    // 確定済みの結果表示を上書きしないようにするためのフラグ
    let multiResultFinalized = false;
    // 前回のfetchが終わる前に次のポーリングが多重発火しないようにするガード
    let resultRequestInFlight = false;
 
    function handleMultiResultResponse(data) {
        // すでに確定済みの結果を表示している場合、通信の時間差で
        // 後から届いた古いレスポンス(waiting_for_opponent等)は無視する
        if (multiResultFinalized) return;
 
        if (data.status === 'waiting_for_opponent') {
            document.getElementById('result-text').textContent = `あなたのスコア: ${score}pt`;
            document.getElementById('result-waiting-note').style.display = 'block';
            // 対戦相手の結果待ち: もう一度はまだ押せないが、ホームには戻れる
            setGameActionButtonsEnabled(false, true);
 
            if (!resultPollInterval) {
                resultPollInterval = setInterval(() => {
                    submitMultiResult();
                }, 3000);
            }
            return;
        }
 
        // ここに来るのは finished / opponent_declined / エラー等、
        // 「これ以上ポーリングする必要がない」結果なので確定フラグを立てる
        multiResultFinalized = true;
 
        clearInterval(resultPollInterval);
        resultPollInterval = null;
        document.getElementById('result-waiting-note').style.display = 'none';
        setGameActionButtonsEnabled(true, true);
 
        if (data.status === 'opponent_declined') {
            // 相手が対戦確認画面で「やめる」を押した場合
            document.getElementById('result-text').textContent =
                `${data.opponent || opponentName} が対戦をキャンセルしました。`;
            return;
        }
 
        if (data.status === 'finished') {
            let youWon = data.winner === playerName;
            let isDraw = data.winner === "引き分け";
            let resultLabel = isDraw ? "引き分け！" : (youWon ? "あなたの勝利！" : `${data.winner} の勝利...`);
 
            // 表示順は必ずサーバー側の player1 → player2 の固定順にする。
            // (以前は「あなた」を必ず先頭に出していたため、見る人によって
            //  数字の左右が入れ替わって見えてしまっていた)
            let p1Label = data.player1_name === playerName
                ? `${data.player1_name}(あなた)` : data.player1_name;
            let p2Label = data.player2_name === playerName
                ? `${data.player2_name}(あなた)` : data.player2_name;
 
            document.getElementById('result-text').textContent =
                `${resultLabel} (${p1Label}: ${data.player1_points}pt vs ${p2Label}: ${data.player2_points}pt)`;
 
            if (!multiPointsAdded) {
                if (youWon) {
                    addPoints(score); // 勝った時だけ累計ポイントに加算
                }
                multiPointsAdded = true;
            }
            loadRanking();
            loadPointsRanking();
        } else {
            document.getElementById('result-text').textContent =
                data.error ? `エラー: ${data.error}` : `結果の取得に失敗しました。`;
        }
    }
 
    function goHomeFromResult() {
        stopAllIntervals();
        currentSessionId = null;
        multiPointsAdded = false;
        multiResultFinalized = false;
        resultRequestInFlight = false;
        showScreen('home-screen');
        loadRanking();
        loadPointsRanking();
        loadOnlineUsers();
    }
 
    function retryGame() {
        stopAllIntervals();
        multiPointsAdded = false;
        multiResultFinalized = false;
        resultRequestInFlight = false;
        if (gameMode === 'single') {
            startSingleGame(difficulty);
        } else {
            startMultiMatch();
        }
    }
</script>
 
</body>
</html>
