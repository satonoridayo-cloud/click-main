<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>オンラインクリックゲーム</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        .user-tag { background: #e1f5fe; color: #0288d1; padding: 6px 12px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        .btn { background: #3498db; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 10px; transition: 0.2s; }
        .btn:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .screen { display: none; }
        .active { display: block; }
        #click-target { width: 150px; height: 150px; background: #e74c3c; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin: 30px auto; cursor: pointer; user-select: none; box-shadow: 0 6px 0 #c0392b; transition: 0.05s; }
        #click-target:active { transform: translateY(4px); box-shadow: 0 2px 0 #c0392b; }
        .timer, .score { font-size: 22px; font-weight: bold; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 13px; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <!-- ホーム画面 -->
    <div id="home-screen" class="screen active">
        <h1>🔥 オンラインクリックゲーム 🔥</h1>
        <div class="user-tag" id="display-username">名前: 読み込み中...</div>
        <br>
        <button class="btn" onclick="showScreen('single-menu-screen')">一人でプレイ (VS CPU)</button>
        <button class="btn" onclick="startMultiMatch()">二人でプレイ (オンライン)</button>
        
        <h3>🏆 ホームランキング</h3>
        <table id="ranking-table">
            <tr><th>日時</th><th>P1 (Pt)</th><th>P2 (Pt)</th><th>勝者</th></tr>
        </table>
    </div>

    <!-- 一人プレイ難易度選択画面 -->
    <div id="single-menu-screen" class="screen">
        <h2>一人プレイ：難易度選択 (VS CPU)</h2>
        <button class="btn" onclick="startSingleGame('easy')">簡単 (CPU: 秒間5回)</button>
        <button class="btn" onclick="startSingleGame('normal')">ちょい難 (CPU: 秒間7回)</button>
        <button class="btn" onclick="startSingleGame('hard')">難しい (CPU: 秒間14回)</button>
        <button class="btn btn-danger" onclick="startSingleGame('death')">死 (CPU: 秒間20回)</button>
        <br><br>
        <button class="btn" style="background:#95a5a6;" onclick="showScreen('home-screen')">戻る</button>
    </div>

    <!-- マッチング待機画面 -->
    <div id="matching-screen" class="screen">
        <h2>オンラインマッチング中...</h2>
        <div class="timer" id="matching-status">ランダムなプレイヤーを探しています...</div>
        <br>
        <button class="btn btn-danger" onclick="cancelMatch()">キャンセル</button>
    </div>

    <!-- ゲームプレイ画面 -->
    <div id="game-screen" class="screen">
        <h2 id="game-title">ゲーム中</h2>
        <div class="timer">残り時間: <span id="time-left">10.0</span> 秒</div>
        <div class="score">あなた: <span id="current-score">0</span> pt</div>
        <div id="cpu-score-area" style="display:none;" class="score">CPU: <span id="current-cpu-score">0</span> pt</div>
        <div id="click-target" onclick="handleClick()">CLICK!</div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen">
        <h2>結果発表</h2>
        <p id="result-text" style="font-size: 18px; font-weight: bold;"></p>
        <br>
        <button class="btn btn-success" onclick="retryGame()">もう一度やる</button>
        <button class="btn" style="background:#95a5a6;" onclick="showScreen('home-screen'); loadRanking();">ホームに戻る</button>
    </div>
</div>

<script>
    // ★ バックエンド（Flask）のURLを指定
    const API_BASE = "https://online-click-nori-pixl.onrender.com";

    function generateRandomName() {
        return "Player_" + Math.floor(Math.random() * 9000 + 1000);
    }

    let playerName = generateRandomName();
    document.getElementById('display-username').textContent = `名前: ${playerName}`;

    let gameMode = ""; 
    let difficulty = "";
    let score = 0;
    let cpuScore = 0;
    let timeLeft = 10.0;
    let timerInterval = null;
    let cpuInterval = null;
    let matchingInterval = null;
    let opponentName = "";

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function loadRanking() {
        fetch(`${API_BASE}/api/ranking`)
        .then(res => res.json())
        .then(data => {
            let table = document.getElementById('ranking-table');
            table.innerHTML = `<tr><th>日時</th><th>P1 (Pt)</th><th>P2 (Pt)</th><th>勝者</th></tr>`;
            data.forEach(row => {
                let dateStr = new Date(row.created_at).toLocaleTimeString();
                table.innerHTML += `<tr>
                    <td>${dateStr}</td>
                    <td>${row.player1_name} (${row.player1_points})</td>
                    <td>${row.player2_name} (${row.player2_points})</td>
                    <td><b>${row.winner}</b></td>
                </tr>`;
            });
        }).catch(err => console.error("ランキング取得エラー:", err));
    }
    loadRanking();

    window.addEventListener('beforeunload', () => {
        navigator.sendBeacon(`${API_BASE}/api/match/cancel`, JSON.stringify({username: playerName}));
    });

    function startSingleGame(diff) {
        difficulty = diff;
        gameMode = 'single';
        score = 0;
        cpuScore = 0;
        timeLeft = 10.0;
        document.getElementById('current-score').textContent = score;
        document.getElementById('current-cpu-score').textContent = cpuScore;
        document.getElementById('cpu-score-area').style.display = 'block';
        document.getElementById('game-title').textContent = `一人プレイ (VS CPU: ${diff.toUpperCase()})`;
        showScreen('game-screen');

        let cpuSpeedMap = { 'easy': 200, 'normal': 143, 'hard': 71, 'death': 50 };
        let cpuIntervalTime = cpuSpeedMap[diff] || 200;

        cpuInterval = setInterval(() => {
            cpuScore += 1;
            document.getElementById('current-cpu-score').textContent = cpuScore;
        }, cpuIntervalTime);

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            let displayTime = Math.max(0, timeLeft);
            document.getElementById('time-left').textContent = displayTime.toFixed(1);

            if (displayTime <= 0) {
                endGame();
            }
        }, 100);
    }

    function startMultiMatch() {
        showScreen('matching-screen');
        document.getElementById('matching-status').textContent = `${playerName} でオンライン行に登録中...`;

        matchingInterval = setInterval(() => {
            fetch(`${API_BASE}/api/match/join`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: playerName})
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'matched') {
                    clearInterval(matchingInterval);
                    opponentName = data.opponent;
                    startMultiGame();
                }
            });
        }, 2000);
    }

    function cancelMatch() {
        clearInterval(matchingInterval);
        fetch(`${API_BASE}/api/match/cancel`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: playerName})
        }).then(() => {
            showScreen('home-screen');
        });
    }

    function startMultiGame() {
        gameMode = 'multi';
        score = 0;
        timeLeft = 10.0;
        document.getElementById('current-score').textContent = score;
        document.getElementById('cpu-score-area').style.display = 'none';
        document.getElementById('game-title').textContent = `対戦: VS ${opponentName}`;
        showScreen('game-screen');

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            let displayTime = Math.max(0, timeLeft);
            document.getElementById('time-left').textContent = displayTime.toFixed(1);

            if (displayTime <= 0) {
                endGame();
            }
        }, 100);
    }

    function handleClick() {
        score += 1;
        document.getElementById('current-score').textContent = score;
    }

    function endGame() {
        // 1. まず確実にタイマーを停止する
        clearInterval(timerInterval);
        if (cpuInterval) clearInterval(cpuInterval);
        timerInterval = null;
        cpuInterval = null;

        // 2. ネットワーク通信を待たずに、即座に結果画面を表示してテキストを設定する
        if (gameMode === 'single') {
            let winLoseText = score > cpuScore ? "あなたの勝利！" : (score < cpuScore ? "CPUの勝利..." : "引き分け！");
            document.getElementById('result-text').textContent = `${winLoseText} (あなた: ${score}pt vs CPU: ${cpuScore}pt)`;
            showScreen('result-screen');

            // 3. サーバーへのデータ保存は裏側（バックグラウンド）でこっそり行う
            fetch(`${API_BASE}/api/single_result`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: playerName, points: score})
            }).catch(err => console.error("結果保存エラー:", err));

        } else if (gameMode === 'multi') {
            document.getElementById('result-text').textContent = `ゲーム終了！ (あなたのスコア: ${score}pt)`;
            showScreen('result-screen');

            fetch(`${API_BASE}/api/match/result`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player1_name: playerName,
                    player1_points: score,
                    player2_name: opponentName,
                    player2_points: 0 
                })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('result-text').textContent = `勝者: ${data.winner}！ (あなたのスコア: ${score}pt)`;
            }).catch(err => console.error("対戦結果送信エラー:", err));
        }
    }

    function retryGame() {
        if (gameMode === 'single') {
            startSingleGame(difficulty);
        } else {
            startMultiMatch();
        }
    }
</script>

</body>
</html>
